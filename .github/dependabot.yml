# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # ESLint 10 is incompatible with eslint-plugin-react 7.x (bundled by
      # eslint-config-next) — context.getFilename() was removed in ESLint 10.
      # Re-enable once eslint-config-next ships with a compatible plugin version.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (bundled by eslint-config-next) refuses to load under
      # TypeScript 7, which breaks `npm run lint`. Re-enable once it supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Matches the Node 22 runtime (.nvmrc, CI); newer majors type APIs the
      # build can't use.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Third-party actions are pinned to commit SHAs; this keeps the pins current.
  # These PRs edit workflow files, which auto-merge can't merge with
  # GITHUB_TOKEN, so they are merged by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
